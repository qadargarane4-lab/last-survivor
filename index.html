<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#090e10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Shadow Sniper">
<title>Shadow Sniper 🎯</title>
<link id="manifest-link" rel="manifest">
<style>
*{box-sizing:border-box;user-select:none;-webkit-user-select:none}
body{margin:0;background:#090e10;color:#e2e8f0;font-family:Arial,sans-serif;text-align:center;padding:8px}
.top{max-width:640px;margin:0 auto 6px;display:flex;justify-content:space-between;align-items:center}
h1{margin:0;font-size:20px;color:#ef4444;letter-spacing:1px}
.sub{font-size:11px;color:#94a3b8;letter-spacing:1.5px}
.hud{max-width:640px;margin:0 auto 8px;display:flex;flex-wrap:wrap;justify-content:space-around;gap:6px;background:#111b1f;border:1px solid #263840;border-radius:10px;padding:7px;font-size:13px;font-weight:bold}
canvas{background:#15201c;width:100%;max-width:640px;display:block;margin:0 auto;border:2px solid #395248;border-radius:12px;touch-action:none;box-shadow:0 12px 28px rgba(0,0,0,0.55)}
.pad{max-width:640px;margin:10px auto 4px;display:grid;grid-template-columns:1fr 1.4fr;gap:8px;align-items:center}
.dpad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,48px);gap:5px;justify-content:center}
.btns{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
button{background:#1b2b31;color:#f8fafc;border:1px solid #456470;border-radius:10px;font-weight:bold;font-size:13px;padding:10px 8px;cursor:pointer;touch-action:manipulation}
button:active{transform:scale(0.95);filter:brightness(1.2)}
#fire{background:#b91c1c;border-color:#f87171;font-size:15px}
#scope{background:#0f766e;border-color:#2dd4bf}
#focus{background:#6d28d9;border-color:#a78bfa}
#stealth{background:#334155;border-color:#94a3b8}
#restart{background:#1e293b;border-color:#64748b;padding:8px 12px}
.tip{font-size:11px;color:#94a3b8;margin-top:4px}
</style>
</head>
<body>
<div class="top">
  <div>
    <h1>SHADOW SNIPER 🎯</h1>
    <div class="sub">TACTICAL RECON & ELIMINATION</div>
  </div>
  <button id="restart" onclick="location.reload()">↻ RESET</button>
</div>

<div class="hud">
  <span id="hpHud">❤️ 100</span>
  <span id="stageHud">📍 Sector 1</span>
  <span id="targetsHud">🎯 0</span>
  <span id="focusHud">⏳ 100%</span>
  <span id="bestHud">🏆 Best: 0</span>
</div>

<canvas id="game" width="640" height="430"></canvas>

<div class="pad">
  <div class="dpad">
    <div></div>
    <button id="up">⬆️</button>
    <div></div>
    <button id="left">⬅️</button>
    <button id="down">⬇️</button>
    <button id="right">➡️</button>
  </div>
  <div class="btns">
    <button id="fire">🔫 FIRE</button>
    <button id="scope">🔍 SCOPE</button>
    <button id="focus">⏳ FOCUS</button>
    <button id="stealth">🫥 STEALTH</button>
  </div>
</div>
<div class="tip">Taabo meesha bartilmaameedka ah si aad u toogato • 🔍 Scope soo dhoweeya • 💥 Fuustooyinka guduudan toogo</div>

<script>
const iconSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192"><rect width="192" height="192" rx="36" fill="#090e10"/><circle cx="96" cy="96" r="62" fill="none" stroke="#ef4444" stroke-width="8"/><circle cx="96" cy="96" r="22" fill="none" stroke="#ef4444" stroke-width="5"/><line x1="96" y1="18" x2="96" y2="174" stroke="#ef4444" stroke-width="4"/><line x1="18" y1="96" x2="174" y2="96" stroke="#ef4444" stroke-width="4"/></svg>`;
const iconUrl = "data:image/svg+xml;base64," + btoa(unescape(encodeURIComponent(iconSvg)));
const manifestData = {
  name: "Shadow Sniper",
  short_name: "Shadow Sniper",
  start_url: "./",
  display: "standalone",
  background_color: "#090e10",
  theme_color: "#090e10",
  icons: [{ src: iconUrl, sizes: "192x192", type: "image/svg+xml" }]
};
document.getElementById("manifest-link").href =
  "data:application/manifest+json;charset=utf-8," + encodeURIComponent(JSON.stringify(manifestData));

if ("serviceWorker" in navigator) {
  const swCode = `
    const CACHE = "shadow-sniper-v1";
    self.addEventListener("install", e => {
      e.waitUntil(caches.open(CACHE).then(c => c.addAll(["./"])));
      self.skipWaiting();
    });
    self.addEventListener("fetch", e => {
      e.respondWith(caches.match(e.request).then(r => r || fetch(e.request)));
    });
  `;
  const swBlob = new Blob([swCode], { type: "application/javascript" });
  navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(() => {});
}

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let best = Number(localStorage.getItem("ss_best") || 0);
let kills = 0, score = 0, sector = 1;
let player = { x: 85, y: 215, r: 12, hp: 100, angle: 0, focus: 100 };
let keys = {};
let scoped = false, focusActive = false, stealthActive = false;
let fireCd = 0, shake = 0, gameOver = false;
let walls = [], barrels = [], enemies = [], bullets = [], explosions = [], particles = [];

function buildSector() {
  walls = [
    { x: 210, y: 70, w: 26, h: 115 },
    { x: 210, y: 245, w: 26, h: 115 },
    { x: 410, y: 110, w: 28, h: 210 }
  ];
  barrels = [
    { x: 330, y: 120, r: 12, hp: 1, exploded: false },
    { x: 330, y: 310, r: 12, hp: 1, exploded: false },
    { x: 515, y: 215, r: 12, hp: 1, exploded: false }
  ];
  enemies = [];
  const count = 4 + sector * 2;
  for (let i = 0; i < count; i++) {
    enemies.push({
      x: 450 + Math.random() * 155,
      y: 45 + Math.random() * 340,
      r: 12,
      hp: 2 + Math.floor(sector / 2),
      spd: 0.75 + sector * 0.06,
      alert: false,
      fireTimer: 70 + Math.random() * 90
    });
  }
}

buildSector();

function addParticles(x, y, color, n = 10) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 1 + Math.random() * 4;
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 25 + Math.random() * 12, color });
  }
}

function explodeAt(x, y, radius = 85) {
  explosions.push({ x, y, r: 8, maxR: radius, alpha: 1 });
  shake = Math.max(shake, 10);
  addParticles(x, y, "#f97316", 22);
  addParticles(x, y, "#facc15", 14);

  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    if (Math.hypot(e.x - x, e.y - y) <= radius + e.r) {
      e.hp -= 5;
      if (e.hp <= 0) {
        addParticles(e.x, e.y, "#ef4444", 12);
        enemies.splice(i, 1);
        kills++;
        score += 25;
      }
    }
  }

  for (const b of barrels) {
    if (!b.exploded && Math.hypot(b.x - x, b.y - y) <= radius + b.r) {
      b.exploded = true;
      setTimeout(() => explodeAt(b.x, b.y, radius), 90);
    }
  }
  updateHud();
}

function shootBullet(fromX, fromY, angle, speed, dmg, friendly, color = "#fde047") {
  bullets.push({
    x: fromX + Math.cos(angle) * 14,
    y: fromY + Math.sin(angle) * 14,
    vx: Math.cos(angle) * speed,
    vy: Math.sin(angle) * speed,
    dmg, friendly, color, life: 110
  });
}

function triggerFire() {
  if (fireCd > 0 || gameOver) return;
  let aim = player.angle;
  if (!keys._aimSet && enemies.length) {
    let near = enemies[0], bestD = Infinity;
    for (const e of enemies) {
      const d = Math.hypot(e.x - player.x, e.y - player.y);
      if (d < bestD) { bestD = d; near = e; }
    }
    aim = Math.atan2(near.y - player.y, near.x - player.x);
    player.angle = aim;
  }
  shootBullet(player.x, player.y, aim, 15, 2, true, "#38bdf8");
  fireCd = scoped ? 22 : 16;
  shake = Math.max(shake, 3);
}

function updateHud() {
  document.getElementById("hpHud").textContent = "❤️ " + Math.max(0, Math.ceil(player.hp));
  document.getElementById("stageHud").textContent = "📍 Sector " + sector;
  document.getElementById("targetsHud").textContent = "🎯 " + kills;
  document.getElementById("focusHud").textContent = "⏳ " + Math.floor(player.focus) + "%";
  if (score > best) {
    best = score;
    localStorage.setItem("ss_best", String(best));
  }
  document.getElementById("bestHud").textContent = "🏆 Best: " + best;
}

["up", "down", "left", "right"].forEach(id => {
  const el = document.getElementById(id);
  el.onpointerdown = e => { e.preventDefault(); keys[id] = true; };
  el.onpointerup = el.onpointerleave = el.onpointercancel = () => { keys[id] = false; };
});

document.getElementById("fire").onclick = () => { keys._aimSet = false; triggerFire(); };
document.getElementById("scope").onclick = () => {
  scoped = !scoped;
  document.getElementById("scope").style.outline = scoped ? "2px solid #5eead4" : "none";
};
document.getElementById("focus").onclick = () => {
  if (player.focus > 15) focusActive = !focusActive;
  document.getElementById("focus").style.outline = focusActive ? "2px solid #c4b5fd" : "none";
};
document.getElementById("stealth").onclick = () => {
  stealthActive = !stealthActive;
  document.getElementById("stealth").style.outline = stealthActive ? "2px solid #cbd5e1" : "none";
};

canvas.addEventListener("pointerdown", e => {
  if (gameOver) return;
  const r = canvas.getBoundingClientRect();
  const tx = (e.clientX - r.left) * (canvas.width / r.width);
  const ty = (e.clientY - r.top) * (canvas.height / r.height);
  player.angle = Math.atan2(ty - player.y, tx - player.x);
  keys._aimSet = true;
  triggerFire();
});

function hitsWall(x, y, rad) {
  for (const w of walls) {
    if (x + rad > w.x && x - rad < w.x + w.w && y + rad > w.y && y - rad < w.y + w.h) {
      return true;
    }
  }
  return false;
}

function loop() {
  const timeScale = focusActive && player.focus > 0 ? 0.42 : 1;
  if (focusActive) {
    player.focus = Math.max(0, player.focus - 0.55);
    if (player.focus <= 0) {
      focusActive = false;
      document.getElementById("focus").style.outline = "none";
    }
  } else {
    player.focus = Math.min(100, player.focus + 0.22);
  }

  ctx.save();
  if (shake > 0) {
    ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    shake *= 0.84;
    if (shake < 0.25) shake = 0;
  }

  ctx.fillStyle = "#15201c";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.strokeStyle = "#22332d";
  for (let gx = 0; gx < canvas.width; gx += 40) {
    ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, canvas.height); ctx.stroke();
  }
  for (let gy = 0; gy < canvas.height; gy += 40) {
    ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(canvas.width, gy); ctx.stroke();
  }

  for (const w of walls) {
    ctx.fillStyle = "#334155";
    ctx.fillRect(w.x, w.y, w.w, w.h);
    ctx.strokeStyle = "#64748b";
    ctx.strokeRect(w.x, w.y, w.w, w.h);
  }

  for (const b of barrels) {
    if (b.exploded) continue;
    ctx.fillStyle = "#dc2626";
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#fca5a5";
    ctx.stroke();
  }

  if (gameOver) {
    ctx.fillStyle = "rgba(0,0,0,0.72)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#ef4444";
    ctx.font = "bold 40px Arial";
    ctx.textAlign = "center";
    ctx.fillText("MISSION FAILED", canvas.width / 2, canvas.height / 2 - 18);
    ctx.fillStyle = "#f8fafc";
    ctx.font = "19px Arial";
    ctx.fillText("Eliminated: " + kills + " | Score: " + score + " | Best: " + best, canvas.width / 2, canvas.height / 2 + 20);
    ctx.restore();
    return;
  }

  let mx = 0, my = 0;
  if (keys.up) my -= 1;
  if (keys.down) my += 1;
  if (keys.left) mx -= 1;
  if (keys.right) mx += 1;
  if (mx || my) {
    const l = Math.hypot(mx, my);
    mx /= l; my /= l;
    const spd = (stealthActive ? 1.8 : 2.7) * timeScale;
    const nx = Math.max(16, Math.min(canvas.width - 16, player.x + mx * spd));
    const ny = Math.max(16, Math.min(canvas.height - 16, player.y + my * spd));
    if (!hitsWall(nx, player.y, player.r)) player.x = nx;
    if (!hitsWall(player.x, ny, player.r)) player.y = ny;
  }

  if (fireCd > 0) fireCd--;

  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    const d = Math.hypot(player.x - e.x, player.y - e.y) || 1;
    const detectRange = stealthActive ? 115 : 250;
    if (d < detectRange) e.alert = true;

    if (e.alert) {
      const ex = e.x + ((player.x - e.x) / d) * e.spd * timeScale;
      const ey = e.y + ((player.y - e.y) / d) * e.spd * timeScale;
      if (!hitsWall(ex, e.y, e.r)) e.x = ex;
      if (!hitsWall(e.x, ey, e.r)) e.y = ey;

      e.fireTimer -= timeScale;
      if (e.fireTimer <= 0 && d < 320) {
        const ang = Math.atan2(player.y - e.y, player.x - e.x);
        shootBullet(e.x, e.y, ang, 5.5, 9, false, "#f87171");
        e.fireTimer = 95 + Math.random() * 55;
      }
    }

    ctx.fillStyle = e.alert ? "#ef4444" : "#84cc16";
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2);
    ctx.fill();
  }

  for (let i = bullets.length - 1; i >= 0; i--) {
    const bl = bullets[i];
    bl.x += bl.vx * timeScale;
    bl.y += bl.vy * timeScale;
    bl.life--;

    ctx.fillStyle = bl.color;
    ctx.beginPath();
    ctx.arc(bl.x, bl.y, 4, 0, Math.PI * 2);
    ctx.fill();

    let remove = bl.life <= 0 || hitsWall(bl.x, bl.y, 3);

    if (!remove && bl.friendly) {
      for (const b of barrels) {
        if (!b.exploded && Math.hypot(bl.x - b.x, bl.y - b.y) < b.r + 5) {
          b.exploded = true;
          remove = true;
          explodeAt(b.x, b.y);
          break;
        }
      }
    }

    if (!remove && bl.friendly) {
      for (let j = enemies.length - 1; j >= 0; j--) {
        const e = enemies[j];
        if (Math.hypot(bl.x - e.x, bl.y - e.y) < e.r + 5) {
          e.hp -= bl.dmg;
          remove = true;
          addParticles(bl.x, bl.y, "#facc15", 5);
          if (e.hp <= 0) {
            addParticles(e.x, e.y, "#ef4444", 12);
            enemies.splice(j, 1);
            kills++;
            score += 15;
            updateHud();
          }
          break;
        }
      }
    } else if (!remove && !bl.friendly) {
      if (Math.hypot(bl.x - player.x, bl.y - player.y) < player.r + 4) {
        player.hp -= bl.dmg;
        remove = true;
        shake = Math.max(shake, 6);
        addParticles(player.x, player.y, "#ef4444", 8);
        updateHud();
        if (player.hp <= 0) gameOver = true;
      }
    }

    if (remove) bullets.splice(i, 1);
  }

  for (let i = explosions.length - 1; i >= 0; i--) {
    const ex = explosions[i];
    ex.r += 5 * timeScale;
    ex.alpha -= 0.05 * timeScale;
    ctx.strokeStyle = `rgba(251, 146, 60, ${Math.max(0, ex.alpha)})`;
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.arc(ex.x, ex.y, ex.r, 0, Math.PI * 2);
    ctx.stroke();
    if (ex.alpha <= 0) explosions.splice(i, 1);
  }

  ctx.save();
  ctx.translate(player.x, player.y);
  ctx.rotate(player.angle);
  ctx.strokeStyle = scoped ? "rgba(45, 212, 191, 0.75)" : "rgba(239, 68, 68, 0.35)";
  ctx.setLineDash([5, 5]);
  ctx.beginPath(); ctx.moveTo(12, 0); ctx.lineTo(360, 0); ctx.stroke();
  ctx.setLineDash([]);

  ctx.fillStyle = stealthActive ? "#94a3b8" : "#38bdf8";
  ctx.beginPath(); ctx.arc(0, 0, player.r, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#f8fafc";
  ctx.fillRect(6, -3, 15, 6);
  ctx.restore();

  if (scoped) {
    ctx.strokeStyle = "#2dd4bf";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(player.x + Math.cos(player.angle) * 90, player.y + Math.sin(player.angle) * 90, 28, 0, Math.PI * 2); ctx.stroke();
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const pt = particles[i];
    pt.x += pt.vx * timeScale;
    pt.y += pt.vy * timeScale;
    pt.life -= timeScale;
    ctx.globalAlpha = Math.max(0, pt.life / 30);
    ctx.fillStyle = pt.color;
    ctx.fillRect(pt.x - 2, pt.y - 2, 4, 4);
    if (pt.life <= 0) particles.splice(i, 1);
  }
  ctx.globalAlpha = 1;

  if (enemies.length === 0) {
    sector++;
    player.hp = Math.min(100, player.hp + 25);
    score += 50;
    updateHud();
    buildSector();
  }

  ctx.restore();
  requestAnimationFrame(loop);
}

updateHud();
loop();
</script>
</body>
</html>
